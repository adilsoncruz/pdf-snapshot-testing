name: Feature Request
description: Suggest an idea or enhancement for pdf-snapshot-testing
title: "feat: [Short summary of the feature request]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much context as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific use case?
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: dropdown
    id: module
    attributes:
      label: Target Module(s)
      multiple: true
      options:
        - pdf-snapshot-core
        - pdf-snapshot-runtime
        - pdf-snapshot-junit
        - pdf-snapshot-kotest
        - General / All
