repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: ktlint-gradle
        name: ktlintCheck (Gradle)
        entry: ./gradlew ktlintCheck
        language: system
        pass_filenames: false
      - id: detekt-gradle
        name: detekt (Gradle)
        entry: ./gradlew detekt
        language: system
        pass_filenames: false
