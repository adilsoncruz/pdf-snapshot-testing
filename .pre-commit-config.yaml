repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: ktlint-gradle
        name: ktlintCheck (Gradle)
        entry: bash -lc 'if [ -x ./gradlew ]; then ./gradlew ktlintCheck; elif command -v gradle >/dev/null 2>&1; then gradle ktlintCheck; else echo "Gradle not found"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: detekt-gradle
        name: detekt (Gradle)
        entry: bash -lc 'if [ -x ./gradlew ]; then ./gradlew detekt; elif command -v gradle >/dev/null 2>&1; then gradle detekt; else echo "Gradle not found"; exit 1; fi'
        language: system
        pass_filenames: false
