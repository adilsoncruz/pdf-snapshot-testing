<html>
    <head>
        <title>PDF Snapshot Report</title>
        <meta charset="UTF-8">
        <style>
            body {
              font-family: system-ui;
              background: #FFF;
              color: #303030;
              padding: 16px;
            }
            section {
              border:1px solid #ddd;
              border-radius:10px;
              padding:20px;
              margin-bottom:30px;
            }
            .grid {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              gap: 12px;
            }
            .cell {
              background: #f5f5f5;
              padding: 8px;
              border-radius: 8px;
              margin-bottom: 5px;
            }
            img {
              width: 100%;
            }
            h2 {
              text-align: left;
              font-size: 14px;
            }
            h4 {
              text-align: right;
            }
        </style>
    </head>
<body>
    <h1>PDF Snapshot Report</h1>
    {{testSections}}
</body>
</html>
