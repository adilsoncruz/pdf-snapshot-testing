<h3>Page {{page}}</h3>
<div class="grid">
    <div class="cell">
        <h2>Expected</h2>
        <img src="data:image/png;base64,{{expected}}"/>
    </div>
    <div class="cell">
        <h2>Diff</h2>
        <img src="data:image/png;base64,{{diff}}"/>
    </div>
    <div class="cell">
        <h2>Generated</h2>
        <img src="data:image/png;base64,{{generated}}"/>
    </div>
</div>
